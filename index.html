/* Layout: Logo-Leiste, Bildband mit Suche, dann geführter Ablauf (1 Vorhaben · 2 Kunde · 3 Besonderheiten) und Bankenliste in Grün/Gelb. Bewusst nur helles Bankshop-Design. */
:root{
  --bg:#F6F6F4; --card:#FFFFFF; --ink:#262350; --text:#333333; --mute:#6B6B76; --line:#DEDEDA;
  --brand:#262350; --accent:#EA8A23; --accent-ink:#B5630A; --soft:#EFEFF4; --note:#FDF3E5;
  --ok:#1E7B4F; --ok-bg:#E9F5EE; --ok-line:#9BCFB2; --warn:#7A5B00; --warn-bg:#FFF6D8; --warn-line:#E6C24A;
  --body:"Open Sans",system-ui,-apple-system,"Segoe UI",Arial,sans-serif; color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.in{max-width:1080px;margin-inline:auto}

.bar{background:var(--card);border-bottom:1px solid var(--line);padding-inline:16px;padding-block:12px}
.bar .in{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.bar img{height:44px;width:auto;display:block}
.bar .who{font-size:13px;color:var(--mute);text-align:right}
.bar .who b{display:block;color:var(--ink);font-size:14px}

.eyebrow{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
h1{font-weight:700;font-size:clamp(28px,5vw,44px);line-height:1.12;margin:8px 0 8px;text-wrap:balance;max-width:18ch}
.sub{max-width:54ch;margin:0 0 22px;color:#FFFFFF;opacity:.92}
.search{display:flex;background:var(--card);border-radius:4px;padding:5px;max-width:680px;box-shadow:0 8px 24px rgba(0,0,0,.28)}
.search input{flex:1;min-width:0;border:0;background:transparent;color:var(--text);font:400 17px var(--body);padding:11px 12px;outline:none}
.search input::placeholder{color:var(--mute)}
.search button{border:0;background:var(--accent);color:#FFFFFF;font-weight:700;border-radius:3px;padding:0 20px}
.sugg{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;min-height:34px;max-width:760px}
.sugg button{border:1px solid rgba(255,255,255,.55);background:rgba(38,35,80,.55);color:#FFFFFF;border-radius:3px;padding:4px 11px;font-size:14px}
.sugg button:hover{background:var(--accent);border-color:var(--accent)}
.sugg span{font-size:14px;color:#FFFFFF;opacity:.85;align-self:center}

main{padding-inline:16px;padding-block:0 48px}
.res{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-top:-26px;position:relative;padding:22px;box-shadow:0 3px 0 #D5D5E0,0 18px 34px rgba(38,35,80,.14)}
.reshead{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start;justify-content:space-between}
.reshead h2{font-size:23px;font-weight:700;color:var(--ink);margin:0;text-wrap:balance}
.reshead p{margin:2px 0 0;color:var(--mute);font-size:14.5px}
.row{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:7px 13px;font-size:14px;font-weight:600;color:var(--ink);box-shadow:0 2px 0 #D5D5E0}
.btn:hover{border-color:var(--ink)}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#FFFFFF;box-shadow:0 2px 0 var(--accent-ink)}
.sel{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;align-items:center}
.sc{display:inline-flex;gap:7px;align-items:center;border:0;border-radius:99px;padding:5px 12px;font-size:14px;font-weight:700;background:var(--soft);color:var(--ink)}
.sc.h{background:var(--brand);color:#FFFFFF}
.sc::after{content:"×";font-size:17px;line-height:1;opacity:.7}
.plus{color:var(--mute);font-weight:700}
.ask{margin-top:14px;background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:8px;padding:14px 16px}
.ask p{margin:0 0 10px}
.ask b{color:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13.5px;color:var(--mute);margin-top:14px}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.dot.g{background:var(--ok)} .dot.y{background:var(--warn-line)}
.hint{background:var(--note);border-left:3px solid var(--accent);padding:10px 14px;font-size:14.5px;margin-top:12px}
.hint b{color:var(--ink)}
.seg{font-size:12.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin:20px 0 8px}
.seg.g{color:var(--ok)} .seg.y{color:var(--warn)}
.banks{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.bank{border:1px solid var(--line);border-radius:10px;padding:13px 15px;display:flex;flex-direction:column;gap:7px;min-width:0;background:var(--card);box-shadow:0 3px 0 #D5D5E0}
.bank.g{background:linear-gradient(180deg,#F3FAF6,var(--ok-bg));border-color:var(--ok-line);box-shadow:0 3px 0 var(--ok-line)}
.bank.y{background:linear-gradient(180deg,#FFFBEA,var(--warn-bg));border-color:var(--warn-line);box-shadow:0 3px 0 var(--warn-line)}
.bhead{display:flex;gap:9px;align-items:flex-start}
.mark{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;color:#FFFFFF;margin-top:1px}
.g .mark{background:var(--ok)} .y .mark{background:#C99700}
.bname{font-weight:700;font-size:16px;color:var(--ink);overflow-wrap:anywhere;background:none;border:0;padding:0;text-align:left;font-family:inherit;cursor:pointer}
.bname:hover{text-decoration:underline}
.docs{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-top:18px}
.dc{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;font-size:14.5px;line-height:1.45}
.dc h3{margin:0 0 8px;font-size:16px;color:var(--ink)}
.dc h4{margin:12px 0 4px;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute)}
.dc ul{margin:0;padding-left:18px}.dc li{margin:3px 0}
.dc .sp{background:#FFF6EA;border-left:4px solid #EA8A23;border-radius:6px;padding:10px 12px;margin-bottom:10px}
.dc .sp b{display:block;margin-bottom:4px;color:var(--ink)}
.dc details summary{cursor:pointer;font-weight:700;color:var(--ink)}
.rest{margin-top:16px}.rest>summary{cursor:pointer;font-weight:700;color:var(--ink);font-size:15px}
.dc h3 .fuer{font-weight:400;font-size:14px;color:var(--mute)}
.dc .selb{margin:10px 0;background:#F1F1F7;border-radius:6px;padding:10px 12px}
.dc .stand{font-size:12.5px;color:var(--mute);margin-top:10px}
.chk{list-style:none;padding:0;margin:0}.chk li{padding:4px 0 4px 26px;position:relative;font-size:14px}.chk li:before{content:"";position:absolute;left:0;top:6px;width:14px;height:14px;border:1.5px solid #262350;border-radius:3px}
.paper h4{margin:14px 0 4px;font-size:13.5px;color:#262350}
.geb{font-size:13.5px;color:var(--mute);line-height:1.35}
.p2{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:3px;padding:1px 6px;margin-right:7px;background:var(--card)}
.p2.bw{color:var(--ok);border:1px solid var(--ok-line)}
.p2.rg{color:var(--ink);border:1px solid #C9C9DA}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tag{font-size:12px;font-weight:600;color:var(--mute);border:1px solid var(--line);background:var(--card);border-radius:3px;padding:1px 6px}
.stt{font-size:12.5px;font-weight:700;border-radius:3px;padding:1px 7px;background:var(--card)}
.stt.yes{color:var(--ok);border:1px solid var(--ok-line)}
.stt.unk{color:var(--warn);border:1px solid var(--warn-line)}
.note{font-size:14px;background:var(--card);border-left:3px solid var(--accent);padding:5px 9px}
.more{border:0;background:none;padding:0;text-align:left;font-size:13.5px;color:var(--accent-ink);font-weight:600;margin-top:auto}
.more:hover{text-decoration:underline}
.out{font-size:14px;color:var(--mute);margin-top:14px}
.kon{margin-top:16px;background:#fff;border:1px solid var(--line,#e3e3ec);border-radius:14px;padding:14px 18px;font-size:14.5px}
.kon summary{cursor:pointer;font-weight:700;color:#262350}
.kon div{white-space:pre-line;margin-top:10px;line-height:1.5;color:#333}
.empty{color:var(--mute);padding:4px 0}
.topicbtn{background:var(--soft);color:var(--ink);border-radius:3px;padding:3px 9px;font-size:14px;font-weight:700;align-self:flex-start}

.grp{margin-top:34px}
.gh{display:flex;align-items:baseline;gap:6px 14px;flex-wrap:wrap;margin-bottom:14px}
.gh h3{font-size:20px;font-weight:700;color:var(--ink);margin:0;padding-bottom:6px;border-bottom:3px solid var(--accent)}
.gh small{color:var(--mute);font-size:14px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:16px;perspective:1000px}
.tiles.sm{grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.tile{--ty:0px;text-align:left;border:1px solid #D9D9E4;background:linear-gradient(160deg,#FFFFFF 0%,#F1F1F8 100%);border-radius:14px;padding:18px 16px 16px;display:flex;flex-direction:column;gap:12px;min-width:0;color:var(--ink);transform:translateY(var(--ty)) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transform-style:preserve-3d;box-shadow:inset 0 1px 0 #FFFFFF,0 5px 0 #C9C9DA,0 14px 22px rgba(38,35,80,.16);transition:transform .14s,box-shadow .14s,border-color .14s}
.tile:hover{--ty:-5px;border-color:var(--accent);box-shadow:inset 0 1px 0 #FFFFFF,0 8px 0 #C9C9DA,0 24px 34px rgba(38,35,80,.24)}
.tile:active{--ty:4px;box-shadow:inset 0 1px 0 #FFFFFF,0 1px 0 #C9C9DA,0 4px 8px rgba(38,35,80,.18)}
.ico{width:52px;height:52px;border-radius:14px;background:linear-gradient(145deg,#3A3680,var(--brand));display:grid;place-items:center;flex:none;box-shadow:0 4px 0 #17153A,0 8px 12px rgba(38,35,80,.28);transform:translateZ(22px)}
.ico svg{width:28px;height:28px;fill:none;stroke:#FFFFFF;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ico svg .a{stroke:var(--accent)}
.tn{font-weight:700;font-size:15.5px;line-height:1.25;overflow-wrap:break-word;hyphens:auto;transform:translateZ(12px)}
.n{font-size:13px;color:var(--accent-ink);font-weight:700;margin-top:auto}
.n.zero,.n.q{color:var(--mute);font-weight:400}
.n.ok{color:var(--ok)}
.tile.sm{flex-direction:row;align-items:center;padding:12px 14px;gap:12px;border-radius:12px}
.tile.sm .ico{width:40px;height:40px;border-radius:11px}
.tile.sm .ico svg{width:22px;height:22px}
.tile.sm .tx{display:flex;flex-direction:column;gap:2px;min-width:0}
.tile.sm .tn{font-size:15px}
.tile.sm .n{margin-top:0}
.tile[aria-pressed="true"]{background:linear-gradient(160deg,#35317A 0%,var(--brand) 100%);border-color:var(--brand);color:#FFFFFF;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 5px 0 var(--accent),0 14px 22px rgba(38,35,80,.3)}
.tile[aria-pressed="true"] .ico{background:linear-gradient(145deg,#F6A04A,var(--accent));box-shadow:0 4px 0 var(--accent-ink)}
.tile[aria-pressed="true"] .n{color:#FFD9AE}
.tile.dim{opacity:.5}
.open{margin-top:40px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px 22px}
.open h3{margin:0 0 6px;font-size:18px;color:var(--ink)}
.open ul{margin:8px 0 0;padding-left:20px}
.open li{margin:4px 0}
footer{margin-top:26px;font-size:13px;color:var(--mute)}
[hidden]{display:none!important}
#sheet{position:fixed;inset:0;z-index:50;background:#ECECF1;overflow:auto;padding-inline:16px;padding-block:16px 40px}
.ptools{max-width:820px;margin:0 auto 14px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;box-shadow:0 3px 0 #D5D5E0}
.ptools label{display:flex;flex-direction:column;font-size:12.5px;font-weight:700;color:var(--mute);gap:3px;flex:1;min-width:150px}
.ptools input{font:400 15px var(--body);padding:7px 9px;border:1px solid var(--line);border-radius:6px;color:var(--text);min-width:0}
.pmsg{flex-basis:100%;font-size:14px;color:var(--warn);background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:6px;padding:8px 12px}
.paper{max-width:820px;margin:0 auto;background:#FFFFFF;padding:36px 40px;box-shadow:0 10px 30px rgba(38,35,80,.18);color:#222222;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.phead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;border-bottom:3px solid var(--accent);padding-bottom:14px}
.phead img{height:48px}
.phead div{text-align:right;font-size:13px;color:var(--mute)}
.paper h2{font-size:24px;color:var(--ink);margin:22px 0 4px}
.pmeta{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:6px 20px;margin:14px 0 6px;font-size:14.5px}
.pmeta b{display:block;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);font-weight:700}
.pbox{background:var(--soft);border-left:4px solid var(--brand);padding:10px 14px;margin:14px 0;font-size:15px}
.pbox b{color:var(--ink)}
.paper h3{font-size:15px;letter-spacing:.06em;text-transform:uppercase;margin:16px 0 4px;padding:6px 10px;border-radius:4px}
.paper h3.g{background:var(--ok-bg);color:var(--ok)} .paper h3.y{background:var(--warn-bg);color:var(--warn)}
.ptw{overflow-x:auto}
.paper table{width:100%;border-collapse:collapse;font-size:14px}
.paper td{padding:6px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.paper td:first-child{width:26px;font-weight:700}
.paper tr{break-inside:avoid}
.paper td.pn{font-weight:700;color:var(--ink);width:38%}
.paper td small{display:block;font-weight:400;color:var(--mute)}
.pfoot{margin-top:16px;break-inside:avoid;border-top:1px solid var(--line);padding-top:10px;font-size:12px;color:var(--mute)}
@page{margin:15mm 12mm}
@media print{
  body>*:not(#sheet){display:none!important}
  #sheet{position:static;background:#FFFFFF;padding:0;overflow:visible}
  .ptools{display:none!important}
  .paper{box-shadow:none;padding:0;max-width:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
